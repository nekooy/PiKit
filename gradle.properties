# --- Gradle ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Serialize the configured task graph so the next build skips configuration.
# Off by default in older Android projects; AGP 8.13 is fine with it. Invalidate
# with --no-configuration-cache after editing a build script's inputs.
org.gradle.configuration-cache=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# --- Kotlin ---
kotlin.code.style=official

# --- PiKit build switches ---------------------------------------------
# The version, in one place. Bumping a release is editing these two lines and
# nothing else: `app/build.gradle.kts` reads them (and refuses a versionName that
# is not a bare `major.minor.patch`, because the app reports it in Settings →
# About PiKit and `TERMUX_VERSION`), and `.github/workflows/release.yml` reads them
# to name the tag and the release. Override both for one build with
# `-Ppikit.versionName=… -Ppikit.versionCode=…`; docs/RELEASING.md has the rule for
# which number to use when.
#
# `versionCode` must go *up* by one for every build that is published: Android
# refuses to install a lower one over a higher one, so a published build with a
# reused code can never be superseded.
pikit.versionName=0.3.0
pikit.versionCode=4

# Where the app looks for a newer release, as `<owner>/<repo>`. One line to change
# if the repository moves: it is compiled into `BuildConfig.REPOSITORY`, which
# Settings → About PiKit shows and its update check asks GitHub about
# (`github.com/<owner>/<repo>/releases/latest` — the release page, not the API; see
# `UpdateCheck.kt`). The check compares the release's tag against `pikit.versionName`
# above, so a release must be a published GitHub Release — which is what
# `.github/workflows/release.yml` creates.
pikit.repository=nekooy/PiKit

# Release signing. All four or none: with none, release APKs are signed with the
# debug key, which is fine to install and impossible to upgrade — see
# docs/BUILDING.md → Signing and docs/RELEASING.md. Never put a value here; pass
# them on the command line or from CI secrets.
#   pikit.keystore.file / .alias / .storePassword / .keyPassword

# Application id. The bundled runtime image is built for this exact name: the
# Termux packages inside it are relocated from /data/data/com.termux by a
# length-preserving byte rewrite, so the id MUST be exactly 10 characters
# (tools/prefix_patch.py enforces this). A different length would shift every
# ELF section offset and corrupt the binaries.
pikit.applicationId=pi.kit.mob

# compileSdk / minSdk / targetSdk.
# targetSdk stays 28, and that is a *ceiling*, not a conservative choice: Android
# 10 (API 29) refuses exec() of files in an app's own writable data directory from
# the untrusted_app_29 SELinux domain up, and the whole runtime lives there.
# AOSP's private/untrusted_app_27.te (25 < targetSdkVersion <= 28) grants
# `app_data_file:file execute_no_trans`; untrusted_app_29.te does not. 28 is
# therefore the highest value that runs. See ARCHITECTURE §1.
#
# compileSdk is unrelated to targetSdk: it only decides which APIs can be
# referenced, and 36 is an AAR floor — the formula renderer's own metadata
# requires it. It must never be conflated with targetSdk.
pikit.compileSdk=36
pikit.minSdk=26
pikit.targetSdk=28

# The prefix the bundled image is built for. Must track applicationId.
pikit.termuxPrefix=/data/data/pi.kit.mob/files/usr
pikit.termuxHome=/data/data/pi.kit.mob/files/home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
