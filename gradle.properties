# --- Gradle ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Serialize the configured task graph so the next build skips configuration.
# Off by default in older Android projects; AGP 8.13 is fine with it. Invalidate
# with --no-configuration-cache after editing a build script's inputs.
org.gradle.configuration-cache=true

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# --- Kotlin ---
kotlin.code.style=official

# --- PiKit build switches ---------------------------------------------
# The version, in one place. Bumping a release is editing these two lines and
# nothing else: `app/build.gradle.kts` reads them (and refuses a versionName that
# is not a bare `major.minor.patch`, because the app reports it in Settings →
# About PiKit and `TERMUX_VERSION`), and `.github/workflows/release.yml` reads them
# to name the tag and the release. Override both for one build with
# `-Ppikit.versionName=… -Ppikit.versionCode=…`; docs/RELEASING.md has the rule for
# which number to use when.
#
# `versionCode` must go *up* by one for every build that is published: Android
# refuses to install a lower one over a higher one, so a published build with a
# reused code can never be superseded.
pikit.versionName=0.4.1
pikit.versionCode=7

# Where the app looks for a newer release, as `<owner>/<repo>`. One line to change
# if the repository moves: it is compiled into `BuildConfig.REPOSITORY`, which
# Settings → About PiKit shows and its update check asks GitHub about
# (`github.com/<owner>/<repo>/releases/latest` — the release page, not the API; see
# `UpdateCheck.kt`). The check compares the release's tag against `pikit.versionName`
# above, so a release must be a published GitHub Release — which is what
# `.github/workflows/release.yml` creates.
pikit.repository=nekooy/PiKit

# Release signing. All four or none: with none, release APKs are signed with the
# debug key, which is fine to install and impossible to upgrade — see
# docs/BUILDING.md → Signing and docs/RELEASING.md. Never put a value here; pass
# them on the command line or from CI secrets.
#   pikit.keystore.file / .alias / .storePassword / .keyPassword

# Application id. The bundled runtime image is built for this exact name: the
# Termux packages inside it are relocated from /data/data/com.termux by a
# length-preserving byte rewrite, so the id MUST be exactly 10 characters
# (tools/prefix_patch.py enforces this). A different length would shift every
# ELF section offset and corrupt the binaries.
pikit.applicationId=pi.kit.mob

# compileSdk / minSdk / targetSdk.
# targetSdk stays 28, and that is a *ceiling*, not a conservative choice: Android
# 10 (API 29) refuses exec() of files in an app's own writable data directory from
# the untrusted_app_29 SELinux domain up, and the whole runtime lives there.
# AOSP's private/untrusted_app_27.te (25 < targetSdkVersion <= 28) grants
# `app_data_file:file execute_no_trans`; untrusted_app_29.te does not. 28 is
# therefore the highest value that runs. See ARCHITECTURE §1.
#
# compileSdk is unrelated to targetSdk: it only decides which APIs can be
# referenced. 37 is an AAR floor — every AndroidX artifact this project now
# resolves (Compose 1.12.1, material3 1.5.0-beta01) declares `minCompileSdk=37`
# in its AAR metadata. It must never be conflated with targetSdk.
pikit.compileSdk=37
pikit.minSdk=26
pikit.targetSdk=28

# AGP 9 applies the Kotlin Android plugin itself, and this build still names its
# own: Kotlin 2.3.21 through `org.jetbrains.kotlin.android`, plus the Compose and
# serialization compiler plugins. Two Kotlin plugin applications on one module is
# a configuration failure, and the built-in one is the newer of the two — the
# Kotlin version this project pins is the one its Compose compiler plugin is
# matched to, so the built-in path is the one that gives.
#
# Read out of AGP 9.4.1's own `BooleanOption` table, where this, `android.newDsl`
# below and `android.sdk.defaultTargetSdkToCompileSdkIfUnset` below that all
# default to `true` and are marked `SoftlyEnforced` with a deprecation target of
# AGP 10 — so all three opt-outs are removed, not merely discouraged, in AGP 10.
# They are what keeps this upgrade to a dependency upgrade: `android.newDsl=false`
# in particular is the difference between "raise AGP, material3 and compileSdk"
# and "also migrate the Kotlin toolchain to AGP's bundled KGP 2.2.10", and the
# Compose compiler plugin has to match the Kotlin version exactly, so the second
# is a far larger change than the one being made.
android.builtInKotlin=false
android.newDsl=false

# AGP 9's own default turns every module's `targetSdk` into `compileSdk` when the
# module does not set one. The app module would be unaffected, because it names
# 28; the two library modules do not, and a targetSdk of 37 on the app is what
# would stop it running at all (ARCHITECTURE §1). Pinned off rather than relied
# on, because the failure it would cause is silent: the build succeeds and the
# app dies on first exec().
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false

# AGP warns about the three switches above and about the legacy variant API they
# re-enable ('applicationVariants', 'testVariants', 'unitTestVariants'), every
# time it configures this project, and it names this property as the way to stop
# it. The warnings are about *AGP 10*, where the switches are removed and the
# migration above has to happen anyway; until then they say nothing a reader of
# the block above did not already know, and a build that prints the same six
# warnings forever is a build whose warnings have stopped being read.
# `UNSUPPORTED_PROJECT_OPTION_USE` is the three option settings,
# `DEPRECATED_DSL` the legacy variant API.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL

# And the Kotlin plugin's own note about the same two switches: with
# `android.builtInKotlin=false` the `org.jetbrains.kotlin.android` plugin *is* the
# plugin that supplies Kotlin, so "it is no longer required" describes the other
# side of a choice this file has already made and explained above. KGP's switch for
# it is per-diagnostic, and this is that diagnostic's name
# (`KotlinToolingDiagnostics.DeprecatedKotlinAndroidPlugin`).
kotlin.suppressGradlePluginWarnings=DeprecatedKotlinAndroidPlugin

# The prefix the bundled image is built for. Must track applicationId.
pikit.termuxPrefix=/data/data/pi.kit.mob/files/usr
pikit.termuxHome=/data/data/pi.kit.mob/files/home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
