[versions]
# AGP 9.x, and the pairing with Gradle is not free: AGP 9.5.0 refuses to apply on
# anything below Gradle 9.6.0 ("Minimum supported Gradle version is 9.6.0"), and the
# wrapper is kept at or above that floor — 9.8.2 at the last bump, which is also
# Gradle's current release.
#
# AGP 9 and not 8.13 because `compileSdk` 37 is an AAR floor: every AndroidX
# artifact this project resolves declares `minCompileSdk=37` and
# `minAndroidGradlePluginVersion=9.1.0` in its own AAR metadata. Under AGP 8.13.2 /
# compileSdk 36 that is 22 AAR-metadata failures, measured on core-ktx 1.19.0 /
# Compose 1.12.0 and again on 1.19.1 / 1.12.1 / compose-bom 2026.09.00.
#
# The floor did not move when Material 3 left the dependency list: it is a
# property of the AndroidX and Compose artifacts this build still resolves, and
# `compileSdk` is unrelated to `targetSdk`, which stays 28 because that is the
# ceiling for exec() out of the app's data directory (§1).
#
# AGP 9 turns three of its own defaults on, and all three are opted out in
# `gradle.properties`: built-in Kotlin, the new DSL, and defaulting a module's
# `targetSdk` to its `compileSdk`. The last is the dangerous one — 28 is a ceiling
# for this app, not a conservative choice (§1).
agp = "9.5.0"
kotlin = "2.4.21"
coreKtx = "1.19.1"
annotation = "1.11.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
coroutines = "1.11.0"
serialization = "1.12.0"
okio = "3.18.2"
# JLaTeXMath's Android port: the typesetter, and the OpenType metrics it carries as
# its own font files. It replaced `io.github.huarangmeng:latex-*`, whose KaTeX
# metrics were correct and 21.7 ms per formula — the measurement is in
# ARCHITECTURE §12.2. See the comment in `app/build.gradle.kts` for what that bought.
jlatexmath = "0.2.0"
# Miuix — the interface. `compose-miuix-ui/miuix` is a Compose Multiplatform
# component library drawing the MIUI/HyperOS idiom: its own theme engine (a seed
# colour in, a whole palette out), preference rows, window dialogs and sheets,
# snackbars and icons. The `-android` artifacts are the ones its guide names for a
# Compose-only Android project; the multiplatform coordinates select the same code.
miuix = "0.9.4"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
jlatexmath = { group = "ru.noties", name = "jlatexmath-android", version.ref = "jlatexmath" }
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
