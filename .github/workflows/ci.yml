# Everything that can be checked without building the runtime image.
#
# The split is deliberate. Assembling an image downloads ~200 MB from upstream
# (the Termux bootstrap, its .deb dependencies, the npm packages for pi) and takes
# tens of minutes per ABI, so it happens in `release.yml` — where the APK needs it
# — and not on every push. What is here is the part that catches a broken change in
# a few minutes: the JVM suites, and the tools that check what Gradle cannot see.
#
# The two things the tests need on the machine are named in docs/BUILDING.md:
# JDK 17–23, and the NDK version `terminal-emulator/build.gradle.kts` pins.
name: CI

on:
  push:
    branches: [main]
  # `branches: [main]` rather than every pull request: a run for a branch nobody will
  # merge into main answers no question, and the repository's first week produced
  # eleven pull-request runs from Dependabot alone.
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must track `ndkVersion` in terminal-emulator/build.gradle.kts; that file is the
  # authority and this is a copy of it, so it is updated in the same change.
  NDK_VERSION: "29.0.14033849"
  # The same pair `release.yml` carries. One spelling per version across the two
  # workflows: the release one installs these build-tools and then runs `apksigner`
  # out of them, and it used to name the version twice — once here and once in the
  # signing check — which is how a check ends up running a binary nobody installed.
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  verify:
    name: Tests and checkers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image already carries the Android SDK, so this only points the
      # build at it. `android-actions/setup-android` is deliberately *not* used: its
      # first act is `sdkmanager tools`, that package is no longer in the SDK
      # repository, and the action fails the job in its own step before any of this
      # runs — measured, on this repository's first CI run, 22 seconds in.
      - name: Locate the Android SDK
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk" || { echo "::error::no Android SDK at $sdk"; exit 1; }
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "PATH=$sdk/cmdline-tools/latest/bin:$PATH"
          } >> "$GITHUB_ENV"
          echo "Using $sdk"

      - name: Accept the SDK licences
        # `|| true` because a repository with nothing pending is not a failure; the
        # install below is what has to succeed.
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install the SDK components and the NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A checkout made on Windows records `gradlew` without its executable bit, so
      # `./gradlew` is "Permission denied" on a Linux runner until this runs. The
      # repository-side fix is `git update-index --chmod=+x gradlew`
      # (CONTRIBUTING.md); this is the belt for that braces.
      - name: Restore the wrapper's executable bit
        run: chmod +x gradlew

      # `testX64DebugUnitTest`, not `testDebugUnitTest`: the ABI is a product
      # flavour, so the task name carries it (AGENTS.md). One flavour runs all of
      # the app's tests; the vendored VT parser has its own suite in its own module.
      - name: Unit tests
        run: ./gradlew :app:testX64DebugUnitTest :terminal-emulator:testDebugUnitTest

      # The same checkers `tools/build-apks.py` runs, minus the ones that need a
      # runtime image or the `.deb` cache that only the image builder fills.
      # `tools/build-apks.py` remains the one command for a full local build.
      - name: The manual's reflow
        run: python tools/reflow-manual.py --check

      - name: The interface strings
        run: python tools/check-locales.py

      - name: The agent's delete guard
        run: node tools/test-safety-guard.mjs

      - name: The relocator's own self-check
        run: node tools/pikit-relocate.js --selfcheck

      - name: The README icon against the launcher icon
        run: python tools/render-icon.py --check
